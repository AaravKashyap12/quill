name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  frontend-and-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pnpm install --frozen-lockfile
      - run: python prototypes/test_scribe_buffer.py
      - run: pnpm typecheck
      - run: pnpm build

  rust:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14]
    steps:
      - uses: actions/checkout@v4
      # Tauri validates exact bundle resource paths during compilation. Tests
      # never start ASR, so provide an empty runner-only file without weakening
      # production or release builds.
      - name: Create CI-only model placeholder
        shell: bash
        run: |
          mkdir -p apps/desktop/src-tauri/resources/models
          : > apps/desktop/src-tauri/resources/models/ggml-base.en.bin
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Rust format
        working-directory: apps/desktop/src-tauri
        run: cargo fmt --check
      - name: Rust tests
        working-directory: apps/desktop/src-tauri
        run: cargo test
      - name: Rust lint
        working-directory: apps/desktop/src-tauri
        run: cargo clippy --all-targets -- -D warnings
