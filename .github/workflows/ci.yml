name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  frontend-and-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m unittest discover -s scripts -p test_prepare_windows_bundler.py
      - run: python -m unittest discover -s scripts -p test_macos_signing.py
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm build

  rust:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - uses: actions/setup-python@v5
        if: runner.os == 'Windows'
        with:
          python-version: "3.13"
      - name: Verify Windows bundler dependency downloads
        if: runner.os == 'Windows'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/prepare_windows_bundler.py
      - name: Build pinned macOS whisper.cpp sidecar
        if: runner.os == 'macOS'
        shell: bash
        run: bash ./scripts/build-whisper.sh metal
      - name: Test macOS signing policy with real signed bundles
        if: runner.os == 'macOS'
        run: python3 -m unittest discover -s scripts -p test_macos_signing.py
      - name: Rust format
        working-directory: apps/desktop/src-tauri
        run: cargo fmt --check
      - name: Rust tests
        working-directory: apps/desktop/src-tauri
        run: cargo test
      - name: Rust lint (Windows)
        if: runner.os == 'Windows'
        working-directory: apps/desktop/src-tauri
        run: cargo clippy --all-targets -- -D warnings
      - name: Rust lint (macOS)
        if: runner.os == 'macOS'
        working-directory: apps/desktop/src-tauri
        run: cargo clippy --all-targets -- -D warnings
