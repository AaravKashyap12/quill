name: Native release

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag, for example v0.2.6
        required: true
        type: string
      ref:
        description: Commit SHA to build
        required: true
        type: string
      publish:
        description: Publish after every platform finishes uploading
        required: false
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v0.2.6
        required: true
        type: string
      ref:
        description: Commit SHA to build (defaults to the selected branch)
        required: false
        type: string
      publish:
        description: Publish immediately after the signed builds finish
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --target x86_64-pc-windows-msvc
            rustTargets: x86_64-pc-windows-msvc
            assetNamePattern: Quill-windows-x64[ext]
          - os: macos-15
            # The app target is required for Tauri to create the signed
            # .app.tar.gz updater artifact; dmg remains the tester installer.
            args: --target universal-apple-darwin --bundles app,dmg
            rustTargets: aarch64-apple-darwin,x86_64-apple-darwin
            assetNamePattern: Quill-macos-universal[ext]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Validate updater signing key
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [[ -z "$TAURI_SIGNING_PRIVATE_KEY" ]]; then
            echo "TAURI_SIGNING_PRIVATE_KEY is not configured. Add it as a repository Actions secret before running a release." >&2
            exit 1
          fi
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rustTargets }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: pnpm install --frozen-lockfile
      - name: Build Windows whisper.cpp
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build-whisper.ps1
      - name: Build universal macOS whisper.cpp sidecar
        if: runner.os == 'macOS'
        shell: bash
        env:
          # Match the app's minimum rather than inheriting the runner's OS.
          MACOSX_DEPLOYMENT_TARGET: "12.0"
        run: bash ./scripts/build-whisper.sh metal
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Sign the complete Mac bundle before DMG/archive/updater signing.
          # Ad-hoc signing needs no certificate and is not notarization.
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && '-' || '' }}
        with:
          tagName: ${{ inputs.tag }}
          releaseName: Quill ${{ inputs.tag }}
          releaseDraft: true
          prerelease: false
          # tauri-action applies this before upload and uses the same name in
          # latest.json, keeping updater archives and signatures paired.
          assetNamePattern: ${{ matrix.assetNamePattern }}
          args: ${{ matrix.args }}
      - name: Verify complete macOS bundle signature
        if: runner.os == 'macOS'
        shell: bash
        run: |
          codesign --verify --deep --strict --all-architectures \
            apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/macos/Quill.app

          python3 - <<'PY'
          import json
          import plistlib
          import subprocess
          from pathlib import Path

          def version(value):
              parts = tuple(int(part) for part in value.split("."))
              return parts + (0,) * (3 - len(parts))

          def minimum_macos(load_commands):
              command = None
              minimums = []
              for line in load_commands.splitlines():
                  fields = line.split()
                  if len(fields) < 2:
                      continue
                  if fields[0] == "cmd":
                      command = fields[1]
                  elif (command == "LC_BUILD_VERSION" and fields[0] == "minos") or (
                      command == "LC_VERSION_MIN_MACOSX" and fields[0] == "version"
                  ):
                      minimums.append(version(fields[1]))
              if len(minimums) != 1:
                  raise RuntimeError("Expected one macOS deployment target per architecture")
              return minimums[0]

          config = json.loads(Path("apps/desktop/src-tauri/tauri.conf.json").read_text())
          minimum = version(config["bundle"]["macOS"]["minimumSystemVersion"])
          app = Path("apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/macos/Quill.app")
          with (app / "Contents/Info.plist").open("rb") as source:
              executable = plistlib.load(source)["CFBundleExecutable"]
          for name in (executable, "whisper-server"):
              binary = app / "Contents/MacOS" / name
              for arch in ("arm64", "x86_64"):
                  subprocess.run(["lipo", str(binary), "-verify_arch", arch], check=True)
                  commands = subprocess.check_output(["otool", "-arch", arch, "-l", str(binary)], text=True)
                  actual = minimum_macos(commands)
                  if actual > minimum:
                      raise RuntimeError(f"{name} ({arch}) requires macOS {actual}, above declared {minimum}")
                  print(f"Verified {name} ({arch}) minimum macOS {actual}")
          PY

      - name: Upload optional CUDA runtime pack
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $assets = @(
            "target/release-assets/quill-cuda-runtime-windows-x64.zip",
            "target/release-assets/quill-cuda-runtime-windows-x64.zip.sha256"
          )
          foreach ($asset in $assets) {
            if (-not (Test-Path -LiteralPath $asset -PathType Leaf)) {
              throw "CUDA release asset is missing: $asset"
            }
          }
          # Upload separately from tauri-action so these files cannot be
          # mistaken for updater archives or added to latest.json.
          gh release upload "${{ inputs.tag }}" $assets --clobber

  publish:
    name: Publish update
    if: ${{ inputs.publish }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Publish release for the in-app updater
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ inputs.tag }}" --repo "${{ github.repository }}" --draft=false --latest
