name: macOS test app

on:
  pull_request:
    paths:
      - ".github/workflows/macos-test-app.yml"
      - "apps/desktop/**"
      - "pnpm-lock.yaml"
      - "scripts/build-whisper.sh"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-test-app-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: pnpm install --frozen-lockfile
      - name: Build pinned universal speech engine
        run: bash scripts/build-whisper.sh metal
      - name: Build optimized universal test app
        env:
          APPLE_SIGNING_IDENTITY: "-"
        run: >-
          pnpm tauri build --target universal-apple-darwin --bundles app,dmg
          --config '{"bundle":{"createUpdaterArtifacts":false}}'
      - name: Verify signatures, architectures and disk image
        shell: bash
        run: |
          set -euo pipefail
          app="apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/macos/Quill.app"
          bundle_id=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Contents/Info.plist")
          [[ "$bundle_id" == "dev.quill.dictation" ]]
          executable=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")
          codesign --verify --deep --strict --all-architectures "$app"
          codesign -dv --verbose=4 "$app"
          for architecture in arm64 x86_64; do
            lipo "$app/Contents/MacOS/$executable" -verify_arch "$architecture"
            lipo "$app/Contents/MacOS/whisper-server" -verify_arch "$architecture"
          done
          mkdir -p test-artifact
          found=0
          for dmg in apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg; do
            [[ -f "$dmg" ]]
            hdiutil verify "$dmg"
            cp "$dmg" test-artifact/Quill-macos-universal-test.dmg
            found=$((found + 1))
          done
          [[ "$found" -eq 1 ]]
          (
            cd test-artifact
            shasum -a 256 Quill-macos-universal-test.dmg > SHA256SUMS.txt
          )
          commit=$(git rev-parse HEAD)
          cat > test-artifact/TESTING.txt <<EOF
          Quill macOS test app
          Source commit: $commit
          Architectures: Apple Silicon arm64 and Intel x86_64
          Build: optimized release profile, ad-hoc signed
          This is a test artifact, not a published release. It is not Developer ID signed or notarized.
          No updater artifacts were generated and no release or deployment was performed.

          Before installing, quit Quill and retain your previous app as a backup.
          Open the DMG and install Quill.app in Applications. Keep only one active copy.
          This build uses the existing Quill settings. A changed ad-hoc app may need renewed Microphone and Accessibility approval.
          If macOS blocks this trusted test build, use System Settings > Privacy & Security > Open Anyway.
          Do not disable Gatekeeper or remove quarantine as a setup step.

          Compare the same microphone, provider, model, language and target app before and after.
          Wait for Listening, then repeat a short sentence three times, a 30-60 second paragraph, and a 2-3 minute dictation.
          Report the Mac/macOS, microphone, provider/model, intended and actual text, missing words and approximate delay after release.
          The patch changes audio downsampling; it does not fix the separate cold microphone-open delay.
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: Quill-macos-universal-test-${{ github.event.pull_request.head.sha || github.sha }}
          path: test-artifact/
          if-no-files-found: error
          retention-days: 7
